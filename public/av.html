<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>JF60 · AV שוסטר</title>
<link rel="stylesheet" href="/field.css">

<body>
<div id="gate" class="gate" hidden>
  <div class="brand">הקרן לירושלים · כנס 60</div>
  <h1>AV · שוסטר</h1>
  <form id="gateForm">
    <label for="gName">שם</label><input id="gName" autocomplete="name">
    <label for="gKey">קוד כניסה</label><input id="gKey" type="password" autocomplete="current-password" required>
    <div class="err" id="gErr" role="alert"></div>
    <button type="submit">כניסה</button>
  </form>
</div>
<div id="app" hidden>
  <header>
    <div class="top">
      <div><div class="brand">הקרן לירושלים · כנס 60</div><h1 id="h1">AV · שוסטר</h1><div class="who" id="who"></div></div>
      <button class="btn" type="button" id="logout">יציאה</button>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </header>
  <main id="main"></main>
</div>
<script src="/clock.js"></script>
<script src="/api-client.js"></script>
<script src="/av.js"></script>
<script src="/field.js"></script>
</body>
</html>

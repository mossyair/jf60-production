<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JF60 Control Room</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500&family=Heebo:wght@400;500;700&display=swap">
<style>
/* Layout: quiet sidebar + one working column. Home is "what needs me" (or "live now" in day-of mode); each area is tabs + list; details open in a side sheet. */
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --sunk:#EFEDE7; --ink:#1D1C19; --muted:#6D685F; --line:#E4E0D7;
  --brand:#A94A2B; --good:#2E7A57; --warn:#9A6510; --bad:#B63E2A; --info:#3B6879;
  --good-bg:#E6F1EB; --warn-bg:#F6EEDC; --bad-bg:#F7E6E1; --info-bg:#E4EEF1;
  --setup:#3B6879; --guest:#56642F; --move:#8A6820; --strike:#A94A2B;
  --on-ink:#FFFFFF; --paper:#FFFFFF; --paper-ink:#1D1C19;
  --display:'Frank Ruhl Libre', Georgia, serif;
  --body:'Heebo', 'Helvetica Neue', Arial, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141412; --surface:#1C1B18; --sunk:#252420; --ink:#EEEAE1; --muted:#A39D91; --line:#302E29;
  --brand:#E08663; --good:#66C49A; --warn:#DDB05A; --bad:#EE8A76; --info:#86B9CB;
  --good-bg:#1D2E25; --warn-bg:#302717; --bad-bg:#35201B; --info-bg:#1B2A30;
  --setup:#86B9CB; --guest:#AEBB7C; --move:#D6B267; --strike:#E08663; --on-ink:#141412; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141412; --surface:#1C1B18; --sunk:#252420; --ink:#EEEAE1; --muted:#A39D91; --line:#302E29;
  --brand:#E08663; --good:#66C49A; --warn:#DDB05A; --bad:#EE8A76; --info:#86B9CB;
  --good-bg:#1D2E25; --warn-bg:#302717; --bad-bg:#35201B; --info-bg:#1B2A30;
  --setup:#86B9CB; --guest:#AEBB7C; --move:#D6B267; --strike:#E08663; --on-ink:#141412; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;max-width:100%}
textarea{min-height:80px;resize:vertical;width:100%}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
nav.side{position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:4px;border-inline-end:1px solid var(--line);background:var(--bg);overflow:auto}
.mark{font-family:var(--display);font-size:22px;padding:0 10px 16px;line-height:1.1}
.mark em{color:var(--brand);font-style:italic}
.mark small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.nav-btn{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 10px;border-radius:9px;color:var(--muted);font-weight:500;text-align:start;min-height:40px;width:100%}
.nav-btn:hover{background:var(--sunk);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.nav-sep{height:1px;background:var(--line);margin:8px 10px}
.badge{margin-inline-start:auto;font-size:11px;font-weight:700;background:var(--ink);color:var(--on-ink);border-radius:999px;padding:1px 7px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:10px}
.tiny-seg{display:flex;background:var(--sunk);border-radius:8px;padding:2px}
.tiny-seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:5px 6px;font-size:12px;color:var(--muted);min-height:30px}
.tiny-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700}
.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}

.main{min-width:0;padding-inline:28px;padding-block:0 90px}
.topbar{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{flex:1;min-width:180px;max-width:520px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;min-height:40px;color:var(--muted);text-align:start}
.search kbd{margin-inline-start:auto;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;font-family:var(--body)}
.count{margin-inline-start:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.count b{font-family:var(--display);font-size:20px;color:var(--ink);font-weight:400}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 6px;min-height:40px;font-size:13px;font-weight:500}
.toggle .sw{width:30px;height:18px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:inset-inline-start .2s}
.toggle[aria-pressed="true"] .sw{background:var(--good)}
.toggle[aria-pressed="true"] .sw::after{inset-inline-start:14px}
.btn{border:0;border-radius:9px;padding:9px 14px;min-height:40px;font-weight:700;background:var(--ink);color:var(--on-ink);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
.btn.good{background:var(--good);color:var(--on-ink)}
.btn.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.linkbtn{border:0;background:none;padding:0;color:var(--info);font-weight:500;text-decoration:underline;text-underline-offset:2px}

.clockbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-top:14px}
.clockbar .play{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none}
.clockbar .t{font-family:var(--display);font-size:24px;line-height:1;min-width:64px}
.clockbar input[type=range]{flex:1;min-width:160px;accent-color:var(--ink);padding:0;border:0;background:none}
.clockbar select{min-height:36px}

.page{max-width:1100px;padding-block:24px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-family:var(--display);font-weight:400;font-size:clamp(27px,4vw,37px);line-height:1.12;margin:4px 0 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;min-height:42px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .c{font-size:11.5px;margin-inline-start:4px;opacity:.7}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;min-height:34px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list > *{border-top:1px solid var(--line)}
.list > *:first-child{border-top:0}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:start}
button.li:hover,.li.click:hover{background:var(--sunk)}
.li .t{font-weight:500}
.li .s{font-size:12.5px;color:var(--muted)}
.li.past{opacity:.5}
.time{font-family:var(--display);font-size:16px;min-width:52px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.drvpin{transform:translate(-50%,-100%);display:inline-block;position:relative;white-space:nowrap}
.drvpin span{display:block;background:var(--good);color:#fff;font:700 12px/1.2 system-ui,sans-serif;padding:4px 8px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.drvpin:after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--good);border-bottom:0}
.drvpin.late span{background:var(--warn)} .drvpin.late:after{border-top-color:var(--warn)}
.drvpin.old span,.drvpin.stopped span{background:#8a9196} .drvpin.old:after,.drvpin.stopped:after{border-top-color:#8a9196}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--info)} .chip.plain{background:var(--sunk);color:var(--muted)}
.chipbtn{border:0;background:none;padding:0}
.tbl td a{color:var(--muted);text-decoration-color:var(--line)}
.tbl td a:hover{color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.k-setup{background:var(--setup)} .k-guest{background:var(--guest)} .k-move{background:var(--move)} .k-strike{background:var(--strike)}

.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.countdown{padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.countdown .big{font-family:var(--display);font-size:64px;line-height:.9}
.countdown .big small{font-size:18px;color:var(--muted);margin-inline-start:6px}
.ready{padding:18px 20px;display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px;background:none;border:0;padding:0;text-align:start}
.track{height:7px;border-radius:99px;background:var(--sunk);overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .4s;display:block}
.fill.bad{background:var(--bad)} .fill.warn{background:var(--warn)} .fill.good{background:var(--good)}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 10px}
.sec-h h2{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.att{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;padding-inline-start:0;background:none;border:0;width:100%;text-align:start}
.att:hover{background:var(--sunk)}
.att .rail{align-self:stretch;border-start-end-radius:4px;border-end-end-radius:4px}
.rail.bad{background:var(--bad)} .rail.warn{background:var(--warn)} .rail.info{background:var(--info)} .rail.good{background:var(--good)}
.att .t{font-weight:500} .att .s{font-size:12.5px;color:var(--muted)}
.go{color:var(--muted);font-size:13px;white-space:nowrap}
.livecard{background:var(--good);color:var(--on-ink);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.livecard .h{font-family:var(--display);font-size:24px;line-height:1.2}
.livecard.idle{background:var(--sunk);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat .n{font-family:var(--display);font-size:30px;line-height:1}
.stat .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.stat .n.bad{color:var(--bad)}
.masked{letter-spacing:.2em;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);padding-top:12px;max-width:70ch}
.empty{padding:26px;text-align:center;color:var(--muted)}

/* table */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:start;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sunk)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;inset-inline-end:0;bottom:0;width:min(540px,100%);background:var(--surface);border-inline-start:1px solid var(--line);z-index:21;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;visibility:hidden}
[dir="rtl"] .sheet{transform:translateX(-100%)}
.sheet.on{transform:none!important;visibility:visible}
.sheet.wide{width:min(760px,100%)}
.sh-h{padding:20px 22px 0;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.sh-h h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.15;margin:4px 0 0}
.x{border:0;background:var(--sunk);border-radius:50%;width:36px;height:36px;flex:none;display:grid;place-items:center}
.sh-b{padding:14px 22px 30px;overflow:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;margin:0;font-size:13.5px;align-items:center}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.ros{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:13.5px;line-height:1.45}
.ros .tm{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ros .full{grid-column:1/-1;color:var(--muted);font-size:12.5px;margin-top:4px}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.box h3{margin:0;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px}
.todo{display:flex;align-items:center;gap:10px;font-size:13.5px}
.todo input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--good);flex:none}
.todo .del{margin-inline-start:auto;border:0;background:none;color:var(--muted);min-width:32px;min-height:32px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{color:var(--ink);font-size:14px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
.ro{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:9px 12px}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.lane{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.lane h3{margin:2px 4px 4px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.kcard .s{font-size:12px;color:var(--muted)}

/* ops views */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{padding:16px;display:flex;flex-direction:column;gap:8px}
.card.gap{border-color:var(--bad)}
.card h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0;line-height:1.15}
.tl{overflow-x:auto}
.tl-in{min-width:760px}
.tl-row{display:grid;grid-template-columns:170px 1fr;border-top:1px solid var(--line)}
.tl-row:first-child{border-top:0}
.tl-lab{padding:12px 14px;font-size:13.5px;font-weight:500;border-inline-end:1px solid var(--line)}
.tl-lab small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.tl-track{position:relative;height:58px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100%/8) 100%}
.tl-axis .tl-track{height:30px;background:none}
.tick{position:absolute;top:7px;font-size:11px;color:var(--muted);transform:translateX(-50%)}
.gbar{position:absolute;top:9px;height:40px;border-radius:7px;padding:3px 8px;color:var(--on-ink);font-size:12px;overflow:hidden;border:0;text-align:start;display:flex;flex-direction:column;justify-content:center;line-height:1.25}
.gbar b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar span{white-space:nowrap;opacity:.9}
.gbar.unk{background:transparent!important;color:var(--bad);border:2px dashed var(--bad)}
.gbar.past{opacity:.45}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--good);z-index:2;pointer-events:none}
.midnight{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink);opacity:.3}
.phone{width:min(370px,100%);border:1px solid var(--line);border-radius:34px;background:var(--bg);padding:11px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.screen{border-radius:24px;overflow:hidden;background:var(--bg);min-height:600px;display:flex;flex-direction:column}
.ph-head{background:var(--ink);color:var(--on-ink);padding:18px}
.ph-head .n{font-family:var(--display);font-size:25px;line-height:1.1}
.ph-body{padding:12px;display:flex;flex-direction:column;gap:9px}
.ph-body .li{background:var(--surface);border:1px solid var(--line);border-radius:12px;grid-template-columns:52px minmax(0,1fr)}
.ph-body .li.iss{border:2px solid var(--bad)}

/* inbox */
.drop{position:relative;border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);transition:background .15s,border-color .15s;cursor:pointer}
.drop.over{border-color:var(--ink);background:var(--sunk)}
.drop .big{font-family:var(--display);font-size:23px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.doc{padding:16px;display:flex;flex-direction:column;gap:12px}
.doc-top{display:flex;gap:12px;align-items:flex-start}
.fileic{width:40px;height:48px;border-radius:6px;background:var(--sunk);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted);flex:none;letter-spacing:.05em}
.av{width:34px;height:34px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);flex:none}
.doc .name{font-weight:500;word-break:break-word}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.field{background:var(--sunk);border-radius:8px;padding:7px 10px}
.field .k{font-size:11px;color:var(--muted)}
.field .v{font-size:13.5px;font-weight:500}
.dest{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.dest select{min-height:36px}
.reading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.types div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.types div:first-child{border-top:0}

/* print */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:6px;padding:28px 30px;box-shadow:0 6px 20px rgba(0,0,0,.08);font-size:12.5px;line-height:1.45}
.paper h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 2px}
.paper h2{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin:16px 0 6px;color:#6D685F}
.paper table{width:100%;border-collapse:collapse}
.paper td{padding:5px 0;border-top:1px solid #E4E0D7;vertical-align:top}
.paper td:first-child{width:82px;font-variant-numeric:tabular-nums}
.paper .sev{color:#B63E2A;font-weight:700}
.paper .ros{color:#4A463D;font-size:11.5px;white-space:pre-line;margin-top:3px;text-align:start}
.docrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;width:100%;border:0;background:none;text-align:start}
.docrow:hover{background:var(--sunk)}
.docrow .fileic{height:52px;width:40px}

/* palette */
.pal{position:fixed;inset:0;z-index:30;display:grid;place-items:start center;padding:12vh 16px 0;background:rgba(0,0,0,.25)}
.pal[hidden]{display:none!important}
.pal-box{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.pal-box input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:16px;background:transparent;outline:none}
.pal-res{max-height:52vh;overflow:auto}
.pal-res button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:transparent;padding:10px 18px;text-align:start}
.pal-res button[aria-selected="true"],.pal-res button:hover{background:var(--sunk)}
.pal-res .k{font-size:12px;color:var(--muted);white-space:nowrap}
.ai-ans{padding:14px 18px;font-size:14px;border-top:1px solid var(--line);background:var(--sunk)}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:all .2s;z-index:40;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.switch{width:40px;height:24px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:inset-inline-start .15s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{inset-inline-start:19px}
.switch:disabled{opacity:.5;cursor:not-allowed}

.bottom{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav.side{display:none}
  .main{padding-inline:16px}
  .hero,.cols,.cols.even{grid-template-columns:1fr}
  .kanban{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;gap:2px}
  .bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 6px;min-width:60px;min-height:44px;position:relative;flex:1}
  .bottom button[aria-current="page"]{color:var(--ink);font-weight:700}
  .bottom .badge{position:absolute;top:0;inset-inline-end:6px;margin:0}
  .count{display:none}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ .sheet,.scrim,.toast,.fill{transition:none} .spin{animation:none} }
body{margin:0}
[hidden]{display:none!important}
.gate-box{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.2);padding:22px;display:flex;flex-direction:column;gap:12px}
.gate-box h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.ro-banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--info-bg);color:var(--info);border-radius:10px;padding:9px 14px;margin-top:14px;font-size:13px}
.ro-banner a{color:inherit;font-weight:700}
.savest{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12.5px;min-height:20px;padding:2px 24px 6px}
.savest.busy{color:var(--info)}.savest.good{color:var(--good)}.savest.bad{color:var(--bad);font-weight:500}
/* an unsaved change must stay reachable even with a drawer open: pin it above everything */
.savest.bad{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:45;background:var(--surface);border:1px solid var(--bad);border-radius:10px;padding:8px 14px;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:calc(100vw - 24px)}
.savest .bad{color:var(--bad);font-weight:500}.savest .linkbtn{font-size:12.5px}
.savest .spin{width:12px;height:12px;margin-inline-end:6px;vertical-align:-2px}
/* first-visit guided tour */
#tour{position:fixed;inset:0;z-index:200;pointer-events:none}
#tour .spot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(20,18,15,.55);outline:2px solid #E9B48A;transition:all .25s ease;pointer-events:none}
#tour .spot.none{width:0;height:0;left:50%;top:40%;outline:0}
#tour .card{position:fixed;width:min(360px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border-radius:14px;padding:18px 18px 14px;box-shadow:0 12px 40px rgba(0,0,0,.25);pointer-events:auto;transition:top .25s ease,left .25s ease}
#tour .card h3{font-family:Georgia,serif;font-weight:500;font-size:19px;margin:0 0 6px}
#tour .card p{font-size:14px;line-height:1.5;margin:0 0 6px;color:var(--ink)}
#tour .card .tip{font-size:12.5px;color:var(--muted)}
#tour .row{display:flex;align-items:center;gap:8px;margin-top:12px}
#tour .dots{flex:1;font-size:12px;color:var(--muted)}
#tour .skip{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:4px}
</style>
</head><body>

      <button class="btn ghost sm" id="suggestTop" type="button" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></svg><span id="suggestTxt">Suggest changes</span></button>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JF60 · Production Control</title>
<style>
  :root {
    --stone:#E8E1D4; --stone-deep:#D6CBB6; --ink:#22201B; --ink-soft:#4A463D;
    --parchment:#F6F2E9; --gold:#B5892E; --gold-deep:#8A6820; --terra:#A24E2E;
    --olive:#6B7145; --sky:#3E6B7A; --line:#C9BFA8;
    --st-open:#A24E2E; --st-progress:#B5892E; --st-confirmed:#6B7145;
    --serif:'Georgia','Frank Ruhl Libre',serif; --sans:'Helvetica Neue','Arial',sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--sans); color:var(--ink); line-height:1.5;
    background:radial-gradient(ellipse at top,rgba(181,137,46,0.05),transparent 60%),var(--parchment); min-height:100vh; }
  .wrap { max-width:1280px; margin:0 auto; padding:0 24px 80px; }

  /* Gate */
  #gate { position:fixed; inset:0; background:var(--parchment); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .gate-card { max-width:400px; width:100%; text-align:center; }
  .gate-card .eyebrow { font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--gold-deep); font-weight:700; }
  .gate-card h1 { font-family:var(--serif); font-size:34px; font-weight:400; margin:8px 0 4px; }
  .gate-card h1 .num { color:var(--terra); font-style:italic; }
  .gate-card p { font-size:13px; color:var(--ink-soft); margin-bottom:20px; }
  .gate-card input { width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:2px;
    font-size:14px; margin-bottom:10px; background:#fff; font-family:var(--sans); }
  .gate-card input:focus { outline:2px solid var(--gold); outline-offset:-1px; }
  .gate-card button { width:100%; padding:11px; background:var(--ink); color:var(--parchment);
    border:none; border-radius:2px; font-size:13px; letter-spacing:.04em; cursor:pointer; }
  .gate-err { color:var(--terra); font-size:12px; min-height:16px; margin-top:6px; }

  header { border-bottom:2px solid var(--ink); padding:28px 0 16px;
    background:linear-gradient(180deg,rgba(232,225,212,0.5),transparent); }
  .header-inner { max-width:1280px; margin:0 auto; padding:0 24px;
    display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; }
  .brand .eyebrow { font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--gold-deep); font-weight:700; margin-bottom:6px; }
  .brand h1 { font-family:var(--serif); font-size:38px; font-weight:400; line-height:1; }
  .brand h1 .num { color:var(--terra); font-style:italic; }
  .brand .conf-theme { font-size:13px; color:var(--gold-deep); font-style:italic; letter-spacing:.01em; margin-top:6px; }
  .brand .sub { font-size:13px; color:var(--ink-soft); margin-top:8px; }
  .header-stats { display:flex; gap:26px; }
  .hstat { text-align:right; } .hstat .n { font-family:var(--serif); font-size:28px; line-height:1; }
  .hstat .l { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-top:4px; }
  .hstat.open .n { color:var(--st-open); } .hstat.conf .n { color:var(--st-confirmed); }
  .role-badge { font-size:10px; padding:3px 8px; border-radius:20px; letter-spacing:.06em; text-transform:uppercase; font-weight:700; }
  .role-badge.admin { background:var(--terra); color:#fff; } .role-badge.edit { background:var(--olive); color:#fff; }
  .role-badge.view { background:var(--sky); color:#fff; }
  .seg-card.noclick { cursor:default; }
  .seg-card.noclick:hover { background:transparent; }

  .toolbar { position:sticky; top:0; z-index:20; background:var(--parchment); border-bottom:1px solid var(--line); padding:12px 24px; }
  .toolbar-inner { max-width:1280px; margin:0 auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .seg { display:flex; border:1px solid var(--line); border-radius:2px; overflow:hidden; }
  .seg button { background:transparent; border:none; padding:7px 14px; font-size:12px; cursor:pointer;
    color:var(--ink-soft); border-right:1px solid var(--line); font-family:var(--sans); }
  .seg button:last-child { border-right:none; }
  .seg button.active { background:var(--ink); color:var(--parchment); }
  .seg button:hover:not(.active) { background:var(--stone); }
  .spacer { flex:1; }
  .search { padding:7px 12px; border:1px solid var(--line); border-radius:2px; font-size:13px; background:#fff; min-width:180px; font-family:var(--sans); }
  .search:focus { outline:2px solid var(--gold); outline-offset:-1px; }
  .chips { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .chip { font-size:11px; padding:4px 10px; border-radius:20px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink-soft); }
  .chip.active { background:var(--ink); color:var(--parchment); border-color:var(--ink); }
  .chip.st-open.active { background:var(--st-open); border-color:var(--st-open); }
  .chip.st-progress.active { background:var(--st-progress); border-color:var(--st-progress); }
  .chip.st-confirmed.active { background:var(--st-confirmed); border-color:var(--st-confirmed); }

  .content { padding-top:24px; }
  .day-head { display:flex; align-items:baseline; gap:16px; padding:20px 0 12px; border-bottom:1px solid var(--line); margin-bottom:4px; }
  .day-head .daynum { font-family:var(--serif); font-style:italic; font-size:15px; color:var(--terra); }
  .day-head .date { font-family:var(--serif); font-size:23px; }
  .day-head .theme { font-size:12px; color:var(--ink-soft); }

  .seg-card { display:grid; grid-template-columns:88px 1fr auto; gap:18px; padding:16px 0;
    border-bottom:1px solid var(--line); align-items:start; cursor:pointer; }
  .seg-card:hover { background:rgba(214,203,182,0.22); }
  .seg-time { font-family:var(--serif); font-size:15px; padding-top:2px; white-space:nowrap; }
  .seg-time .end { display:block; font-size:12px; color:var(--ink-soft); }
  .seg-title { font-size:15px; font-weight:600; margin-bottom:3px; }
  .seg-venue { font-size:12px; color:var(--sky); font-weight:600; }
  .seg-venue::before { content:"\25C8  "; color:var(--gold); }
  .seg-desc { font-size:12.5px; color:var(--ink-soft); margin-top:6px; max-width:620px; }
  .seg-meta { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .tag { font-size:10px; padding:2px 7px; border-radius:2px; background:var(--stone); color:var(--ink-soft); }
  .tag.tbc { background:rgba(162,78,46,0.14); color:var(--terra); font-weight:700; }
  .tag.people { background:rgba(62,107,122,0.12); color:var(--sky); }
  .tag.meal { background:rgba(107,113,69,0.14); color:var(--olive); }
  .seg-status { display:flex; flex-direction:column; align-items:flex-end; }
  .dot { display:flex; align-items:center; gap:6px; font-size:11px; letter-spacing:.04em; text-transform:uppercase; font-weight:700; }
  .dot i { width:9px; height:9px; border-radius:50%; }
  .dot.open i { background:var(--st-open); } .dot.open { color:var(--st-open); }
  .dot.progress i { background:var(--st-progress); } .dot.progress { color:var(--st-progress); }
  .dot.confirmed i { background:var(--st-confirmed); } .dot.confirmed { color:var(--st-confirmed); }

  .loose-group { margin-bottom:24px; }
  .loose-group h3 { font-family:var(--serif); font-size:18px; font-weight:400; padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:4px; }
  .loose-item { display:grid; grid-template-columns:22px 1fr auto; gap:12px; align-items:center;
    padding:11px 0; border-bottom:1px solid var(--line); }
  .loose-item:hover { background:rgba(214,203,182,0.22); }
  .lcheck { width:18px; height:18px; border:1.5px solid var(--line); border-radius:3px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; flex-shrink:0; }
  .loose-item.done .lcheck { background:var(--st-confirmed); border-color:var(--st-confirmed); }
  .loose-item.done .litext { text-decoration:line-through; color:var(--ink-soft); }
  .litext { font-size:13.5px; cursor:pointer; }
  .litext .ctx { font-size:11px; color:var(--ink-soft); display:block; margin-top:2px; }
  .litext .by { color:var(--gold-deep); font-style:italic; }
  .lmeta { display:flex; gap:8px; align-items:center; }
  .own-badge { display:inline-block; font-size:9.5px; padding:1px 6px; border-radius:10px; background:rgba(62,107,122,0.13); color:var(--sky); font-weight:700; letter-spacing:.02em; margin-left:4px; }
  .own-badge.unassigned { background:rgba(162,78,46,0.10); color:var(--terra); font-weight:400; font-style:italic; }
  .del-btn { background:none; border:none; color:var(--terra); cursor:pointer; font-size:17px; padding:2px 6px; opacity:0.6; }
  .del-btn:hover { opacity:1; }
  .edit-btn { background:none; border:none; color:var(--sky); cursor:pointer; font-size:14px; padding:2px 5px; opacity:0.7; }
  .edit-btn:hover { opacity:1; }
  .del-btn:hover { color:var(--terra); }

  .add-row { display:flex; gap:8px; margin:14px 0 4px; }
  .add-row input { flex:1; padding:9px 12px; border:1px solid var(--line); border-radius:2px; font-size:13px; background:#fff; font-family:var(--sans); }
  .add-row input:focus { outline:2px solid var(--gold); outline-offset:-1px; }
  .add-row button { padding:9px 16px; background:var(--olive); color:#fff; border:none; border-radius:2px; font-size:12px; cursor:pointer; letter-spacing:.03em; }
  .add-row button:hover { background:#565b38; }

  .drawer-back { position:fixed; inset:0; background:rgba(34,32,27,0.42); z-index:50; opacity:0; pointer-events:none; transition:opacity .18s; }
  .drawer-back.on { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; height:100%; width:min(460px,92vw); background:var(--parchment);
    z-index:51; box-shadow:-8px 0 40px rgba(0,0,0,0.2); transform:translateX(100%);
    transition:transform .22s cubic-bezier(.4,0,.2,1); overflow-y:auto; border-left:3px solid var(--gold); }
  .drawer.on { transform:translateX(0); }
  .drawer-hd { padding:24px 24px 16px; border-bottom:1px solid var(--line); }
  .drawer-hd .dtime { font-family:var(--serif); color:var(--terra); font-size:13px; font-style:italic; }
  .drawer-hd h2 { font-family:var(--serif); font-size:24px; font-weight:400; margin:4px 0 8px; }
  .drawer-body { padding:20px 24px; }
  .field { margin-bottom:20px; }
  .field label { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-deep); font-weight:700; display:block; margin-bottom:6px; }
  .field .val { font-size:14px; }
  .status-picker { display:flex; gap:6px; }
  .status-picker button { flex:1; padding:9px; border:1px solid var(--line); background:#fff; cursor:pointer;
    font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; border-radius:2px; }
  .status-picker button.sel.open { background:var(--st-open); color:#fff; border-color:var(--st-open); }
  .status-picker button.sel.progress { background:var(--st-progress); color:#fff; border-color:var(--st-progress); }
  .status-picker button.sel.confirmed { background:var(--st-confirmed); color:#fff; border-color:var(--st-confirmed); }
  .people-list { list-style:none; }
  .people-list li { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dotted var(--line); font-size:13px; }
  .people-list li .pcheck { cursor:pointer; width:16px; height:16px; border:1.5px solid var(--line); border-radius:3px;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; flex-shrink:0; }
  .people-list li.conf .pcheck { background:var(--st-confirmed); border-color:var(--st-confirmed); }
  .people-list li.conf .pname { color:var(--ink-soft); }
  .notes-area { width:100%; min-height:80px; padding:10px; border:1px solid var(--line); border-radius:3px;
    font-family:var(--sans); font-size:13px; resize:vertical; background:#fff; }
  .notes-area:focus { outline:2px solid var(--gold); outline-offset:-1px; }
  .drawer-close { position:absolute; top:20px; left:20px; background:none; border:none; font-size:22px; cursor:pointer; color:var(--ink-soft); }
  .save-hint { font-size:11px; color:var(--olive); margin-top:4px; height:14px; }

  .empty { text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty .big { font-family:var(--serif); font-size:22px; color:var(--olive); margin-bottom:6px; }
  .progress-bar { height:4px; background:var(--stone-deep); border-radius:2px; overflow:hidden; margin-top:12px; }
  .progress-bar i { display:block; height:100%; background:linear-gradient(90deg,var(--olive),var(--gold)); transition:width .4s; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
    background:var(--ink); color:var(--parchment); padding:10px 20px; border-radius:3px; font-size:13px;
    z-index:80; transition:transform .25s; }
  .toast.on { transform:translateX(-50%) translateY(0); }
  .offline { background:var(--terra); }

  .gridtbl { border-collapse:collapse; width:100%; font-size:13px; }
  .gridtbl th, .gridtbl td { border:1px solid var(--line); padding:0; }
  .gridtbl .rownum { background:var(--stone); color:var(--ink-soft); font-size:11px; text-align:center; padding:0 4px; }
  .gcell { width:100%; min-width:90px; border:none; background:#fff; padding:7px 9px; font-family:var(--sans); font-size:13px; color:var(--ink); }
  .gcell:focus { outline:2px solid var(--gold); outline-offset:-2px; background:#fffef8; }
  .gcell.ghead { background:var(--stone); font-weight:700; color:var(--ink); }
  .gridtabs { display:flex; gap:2px; flex-wrap:wrap; border-bottom:2px solid var(--ink); }
  .gridtab { background:var(--stone); border:1px solid var(--line); border-bottom:none; padding:7px 14px; font-size:12px; cursor:pointer; color:var(--ink-soft); border-radius:4px 4px 0 0; font-family:var(--sans); }
  .gridtab.active { background:var(--ink); color:var(--parchment); font-weight:700; }
  .gridtab.addtab { background:transparent; color:var(--gold-deep); font-weight:700; font-size:15px; padding:7px 12px; }
  .gridtab:hover:not(.active):not(.addtab) { background:var(--stone-deep); }
  .drawer .add-row input[type=file] { font-size:12px; }
  .rt-toolbar { display:flex; flex-wrap:wrap; gap:3px; align-items:center; padding:8px; border:1px solid var(--line); border-bottom:none; border-radius:4px 4px 0 0; background:var(--stone); }
  .rt-toolbar button { min-width:30px; height:30px; border:1px solid transparent; background:#fff; border-radius:3px; cursor:pointer; font-size:13px; color:var(--ink); padding:0 6px; }
  .rt-toolbar button:hover { border-color:var(--line); background:var(--parchment); }
  .rt-toolbar select { height:30px; border:1px solid var(--line); border-radius:3px; background:#fff; font-size:12px; padding:0 4px; font-family:var(--sans); cursor:pointer; }
  .rt-sep { width:1px; height:22px; background:var(--line); margin:0 3px; }
  .rt-color { position:relative; width:30px; height:30px; display:flex; align-items:center; justify-content:center; background:#fff; border:1px solid transparent; border-radius:3px; cursor:pointer; font-weight:700; font-size:14px; }
  .rt-color:hover { border-color:var(--line); }
  .rt-color input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .rt-editor { min-height:58vh; border:1px solid var(--line); border-radius:0 0 4px 4px; background:#fff; padding:16px 18px; font-size:14px; line-height:1.65; overflow-y:auto; }
  .rt-editor:focus { outline:none; box-shadow:inset 0 0 0 2px rgba(181,137,46,0.35); }
  .rt-editor h1 { font-size:24px; font-family:var(--serif); font-weight:400; margin:8px 0; }
  .rt-editor h2 { font-size:20px; font-family:var(--serif); font-weight:400; margin:8px 0; }
  .rt-editor h3 { font-size:16px; font-weight:700; margin:6px 0; }
  .rt-editor ul, .rt-editor ol { margin:6px 0; padding-left:26px; }
  .rt-editor p { margin:6px 0; }
  @media (max-width:720px){
    .seg-card { grid-template-columns:66px 1fr; }
    .seg-status { grid-column:2; flex-direction:row; }
    .brand h1 { font-size:28px; }
  }
  html[dir="rtl"] .seg-desc, html[dir="rtl"] .seg-title { text-align:right; }
  html[dir="rtl"] .seg-card { direction:rtl; }
  html[dir="rtl"] .seg-time { direction:ltr; text-align:left; }
  html[dir="rtl"] .drawer-body, html[dir="rtl"] .drawer-hd h2 { text-align:right; }

  /* Food & Drink tab */
  .food-row { border-bottom:1px solid var(--line); }
  .food-row summary { display:flex; gap:18px; padding:16px 0; align-items:start; cursor:pointer; list-style:none; }
  .food-row summary::-webkit-details-marker { display:none; }
  .food-row[open] { background:rgba(214,203,182,0.16); }
  .food-time { width:130px; flex-shrink:0; font-family:var(--serif); font-size:15px; }
  .food-time .end { display:block; font-size:11px; color:var(--ink-soft); font-family:var(--sans); }
  .food-main { flex:1; }
  .food-title { font-size:14px; font-weight:600; }
  .food-venue { font-size:12px; color:var(--sky); font-weight:600; margin-top:2px; }
  .food-body { padding:0 0 26px 148px; max-width:820px; }
  .food-source { font-size:12px; color:var(--ink-soft); margin-bottom:12px; }
  .food-source a { color:var(--sky); }
  .food-course { border:1px solid var(--line); border-radius:4px; overflow:hidden; background:#fff; margin-top:8px; }
  .food-course-sec { padding:12px 16px; }
  .food-course-sec + .food-course-sec { border-top:1px solid var(--line); }
  .food-course-hd { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; margin-bottom:4px; }
  .food-choice-hd { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .food-item-line { font-size:14px; margin:2px 0; }
  .food-opt { display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--line); border-radius:3px; background:#fff; cursor:pointer; font-size:13px; margin-bottom:6px; }
  .food-opt.sel { border-color:var(--olive); background:rgba(107,113,69,0.08); }
  .food-opt.locked { cursor:default; opacity:.9; }
  .badge-locked { font-size:10px; padding:2px 8px; border-radius:2px; background:var(--st-confirmed); color:#fff; font-weight:700; }
  .badge-pending { font-size:10px; padding:2px 8px; border-radius:2px; background:var(--st-progress); color:#fff; font-weight:700; }
  .food-upload-drop { display:flex; align-items:center; justify-content:center; gap:8px; border:1.5px dashed var(--line); border-radius:4px; padding:16px; font-size:12px; color:var(--ink-soft); background:#fff; cursor:pointer; max-width:420px; transition:border-color .15s, background .15s; }
  .food-upload-drop.dragover { border-color:var(--olive); background:rgba(107,113,69,0.08); color:var(--olive); }
  .food-upload-drop input[type=file] { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }
  .dietary-table { border:1px solid var(--line); border-radius:3px; overflow:hidden; background:#fff; }
  .dietary-row { display:grid; grid-template-columns:1.1fr 1.5fr 1.7fr 1.3fr auto; gap:10px; padding:11px 16px; font-size:13px; align-items:center; border-top:1px solid var(--line); }
  .dietary-row:first-child { border-top:none; }
  .dietary-hd { background:var(--stone); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; }
  .dietary-chip { font-size:12px; padding:5px 13px; border-radius:20px; background:#fff; border:1px solid var(--line); }
  .dietary-chip.severe { background:var(--terra); color:#fff; border-color:var(--terra); }
  html[dir="rtl"] .food-body { padding:0 148px 26px 0; }
  html[dir="rtl"] .food-row summary { direction:rtl; }
  html[dir="rtl"] .food-time { direction:ltr; text-align:right; }
  html[dir="rtl"] .food-title, html[dir="rtl"] .food-venue, html[dir="rtl"] .food-item-line { text-align:right; }
  html[dir="rtl"] .food-course-sec, html[dir="rtl"] .food-course-hd { text-align:right; }
  html[dir="rtl"] .dietary-row { direction:rtl; text-align:right; }

  /* Guest registry */
  .g-row { border-top:1px solid var(--line); }
  .g-row summary { display:grid; grid-template-columns:1.5fr 0.8fr 1.3fr 1fr 1.2fr 28px; gap:10px;
    padding:11px 16px; font-size:13px; align-items:center; cursor:pointer; list-style:none; }
  .g-row summary::-webkit-details-marker { display:none; }
  .g-row[open] { background:rgba(214,203,182,0.2); }
  .g-row .sub { font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .g-head { display:grid; grid-template-columns:1.5fr 0.8fr 1.3fr 1fr 1.2fr 28px; gap:10px; background:var(--stone);
    padding:10px 16px; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; }
  .g-table { border:1px solid var(--line); border-radius:3px; overflow:hidden; background:#fff; }
  .g-body { padding:6px 16px 22px; border-top:1px solid var(--line); }
  .g-grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; margin-top:14px; }
  .g-lab { font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--gold-deep); font-weight:700; margin-bottom:5px; }
  .g-val { font-size:13px; line-height:1.75; }
  .g-in { width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:2px; font-size:13px; font-family:var(--sans); background:#fff; }
  .g-chip { font-size:10px; padding:2px 8px; border-radius:2px; background:var(--stone); color:var(--ink-soft); }
  .g-chip.sev { background:var(--terra); color:#fff; font-weight:700; }
  .g-chip.rev { background:rgba(181,137,46,0.2); color:var(--gold-deep); font-weight:700; }
  .g-note { font-size:12.5px; background:var(--parchment); border:1px solid var(--line); border-radius:3px; padding:10px 12px; line-height:1.7; }
  .g-sess { display:flex; flex-wrap:wrap; gap:7px; }
  .g-sess label { display:flex; align-items:center; gap:6px; font-size:12.5px; border:1px solid var(--line); border-radius:3px; padding:5px 10px; cursor:pointer; }
  .g-sess label.on { border-color:var(--olive); background:rgba(107,113,69,0.09); }
  .g-card { border:1px solid var(--line); border-radius:4px; background:#fff; padding:14px 16px; }
  .imp-row { padding:10px 18px; border-bottom:1px solid var(--line); font-size:13px; display:flex; gap:11px; align-items:center; }
  .imp-tag { font-size:10px; padding:2px 8px; border-radius:2px; color:#fff; font-weight:700; min-width:42px; text-align:center; }
  html[dir="rtl"] .g-row summary, html[dir="rtl"] .g-head { direction:rtl; text-align:right; }

  /* Design & print */
  .d-row { border-top:1px solid var(--line); }
  .d-row summary { display:grid; grid-template-columns:2.1fr 0.7fr 0.7fr 1.1fr 1.25fr 26px; gap:10px;
    padding:11px 16px; font-size:13px; align-items:center; cursor:pointer; list-style:none; }
  .d-row summary::-webkit-details-marker { display:none; }
  .d-row[open] { background:rgba(214,203,182,0.2); }
  .d-head { display:grid; grid-template-columns:2.1fr 0.7fr 0.7fr 1.1fr 1.25fr 26px; gap:10px; background:var(--stone);
    padding:10px 16px; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; }
  .d-sub { font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .d-body { padding:6px 16px 22px; border-top:1px solid var(--line); }
  .d-tag { font-size:10px; padding:3px 9px; border-radius:2px; font-weight:700; color:#fff; white-space:nowrap; }
  .d-grid { display:grid; grid-template-columns:1.4fr 1fr; gap:24px; margin-top:14px; }
  .d-proof { border:1px solid var(--line); border-radius:4px; background:#fff; overflow:hidden; }
  .d-drop { display:block; border:1.5px dashed var(--line); border-radius:4px; background:#fff; padding:22px; text-align:center; font-size:12.5px; color:var(--ink-soft); cursor:pointer; }
  .d-drop.dragover { border-color:var(--olive); background:rgba(107,113,69,0.08); color:var(--olive); }
  .d-drop input[type=file] { position:absolute; width:1px; height:1px; opacity:0; }
  .d-signoff { border:1px solid var(--sky); border-radius:4px; background:#fff; padding:12px 14px; margin-top:11px; }
  .d-hist { font-size:12px; line-height:1.85; color:var(--ink-soft); }
  html[dir="rtl"] .d-row summary, html[dir="rtl"] .d-head { direction:rtl; text-align:right; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="eyebrow">Jerusalem Foundation</div>
    <h1><span class="num">60</span>th Anniversary · Production</h1>
    <p>Enter your access key to continue.</p>
    <input id="gateKey" type="password" placeholder="Access key" autocomplete="off">
    <input id="gateName" type="text" placeholder="Your name (so edits are attributed)" autocomplete="off">
    <button id="gateBtn">Enter</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<div id="main" style="display:none;">
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="eyebrow">Jerusalem Foundation · Production Control</div>
        <h1><span class="num">60</span>th Anniversary Conference</h1>
        <div class="conf-theme" id="confTheme">Jerusalem — Yesterday, Today and Tomorrow</div>
        <div class="sub">20–22 October 2026 <span id="roleWrap"></span></div>
        <div style="font-size:13px;margin-top:6px;"><a href="/control" id="toControl" style="color:var(--ink-soft);font-weight:600;">Try the Control Room →</a></div>
      </div>
      <div class="header-stats">
        <div class="hstat open"><div class="n" id="cOpen">–</div><div class="l">Open</div></div>
        <div class="hstat"><div class="n" id="cProg">–</div><div class="l">In progress</div></div>
        <div class="hstat conf"><div class="n" id="cConf">–</div><div class="l">Confirmed</div></div>
      </div>
    </div>
    <div class="header-inner" style="margin-top:12px;">
      <div style="flex:1;"><div class="progress-bar"><i id="pbar" style="width:0%"></i></div></div>
      <div style="font-size:12px;color:var(--ink-soft);margin-left:14px;" id="pctLabel">0% locked</div>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-inner">
      <div class="seg" id="viewSwitch">
        <button data-view="schedule" class="active" data-t="schedule">Schedule</button>
        <button data-view="files" data-t="files">Files</button>
        <button data-view="guests" data-t="guests">Guests</button>
        <button data-view="food" data-t="food">Food &amp; Drink</button>
        <button data-view="design" data-t="design">Design &amp; Print</button>
        <button data-view="transport" data-t="transport">Transport</button>
        <button data-view="contacts" data-t="contacts">Contacts</button>
        <button data-view="notes" data-t="notes">Notes</button>
        <button data-view="timeline" data-t="timeline">Timeline</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="spacer"></div>
      <input class="search" id="search" placeholder="Search…">
      <button class="btn-ghost" id="langToggle" style="font-weight:700;min-width:44px;">עב</button>
      <button class="btn-ghost" id="pdfBtn" title="Export schedule to PDF">⭳ PDF</button>
      <button class="btn-ghost" id="busToggle" title="Include hotel pickup times in the guest PDF">Bus times</button>
      <button class="btn-ghost" id="rosBtn" title="Export detailed schedule">⭳ Run of show</button>
    </div>
  </div>

  <div class="wrap"><div class="content" id="content"></div></div>
</div>

<div class="drawer-back" id="drawerBack"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script src="/clock.js"></script>
<script src="/api-client.js"></script>
<script src="/dashboard.js"></script>
<script src="/logout.js"></script>
</body>
</html>
